@keyframes slowZoom{from{transform:scale(1.06)}to{transform:scale(1.14)}}
.hero-veil-top{
  position:absolute;inset:0 0 auto 0;height:42%;
  background:linear-gradient(to bottom,rgba(6,9,24,.82),rgba(6,9,24,0));
}
.hero-veil-bottom{
  position:absolute;inset:auto 0 0 0;height:36%;
  background:linear-gradient(to top,var(--night) 8%,rgba(11,16,38,0));
}
#petals{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.hero-inner{
  position:relative;z-index:2;
  width:100%;max-width:640px;
  padding:calc(env(safe-area-inset-top,0px) + 8vh) 24px 0;
  text-align:center;
}
.hero-tag{
  display:inline-block;
  font-size:13px;letter-spacing:.5em;text-indent:.5em;
  color:#ffe9b0;
  border:1px solid rgba(245,214,123,.45);
  border-radius:999px;
  padding:7px 18px 6px;
  backdrop-filter:blur(4px);
  background:rgba(11,16,38,.25);
  animation:fadeDown 1.2s .3s cubic-bezier(.16,1,.3,1) backwards;
}
.hero-title{
  margin-top:3.2vh;
  font-size:clamp(52px,15vw,104px);
  font-weight:700;
  letter-spacing:.08em;
  color:var(--gold);
  text-shadow:0 0 26px rgba(245,214,123,.38),0 2px 0 rgba(120,72,10,.55);
  display:flex;justify-content:center;gap:.04em;
  user-select:none;
}
.hero-title span{
  display:inline-block;
  animation:riseIn 1s cubic-bezier(.16,1,.3,1) backwards;
}
.hero-title span:nth-child(1){animation-delay:.55s}
.hero-title span:nth-child(2){animation-delay:.75s}
.hero-title span:nth-child(3){animation-delay:.95s}
.hero-title span:nth-child(4){animation-delay:1.15s}
@keyframes riseIn{from{opacity:0;transform:translateY(34px) rotate(3deg)}to{opacity:1;transform:translateY(0) rotate(0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
.hero-sub{
  margin-top:2.4vh;
  font-size:clamp(15px,4.2vw,19px);
  letter-spacing:.42em;text-indent:.42em;
  color:#fbeecb;
  animation:fadeDown 1.2s 1.55s cubic-bezier(.16,1,.3,1) backwards;
}
.hero-date{
  margin-top:1.4vh;font-size:13px;letter-spacing:.3em;text-indent:.3em;
  color:rgba(251,238,203,.62);
  animation:fadeDown 1.2s 1.8s cubic-bezier(.16,1,.3,1) backwards;
}
.scroll-hint{
  position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
  transform:translateX(-50%);z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  color:rgba(251,238,203,.75);font-size:11px;letter-spacing:.28em;text-indent:.28em;
  animation:fadeDown 1.2s 2.3s backwards;
}
.scroll-hint svg{animation:bounce 1.8s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}

/* ---------- 寄语 ---------- */
.blessing{
  position:relative;
  padding:11vh 24px 9vh;
  background:
    radial-gradient(ellipse 62% 34% at 50% -4%,rgba(245,214,123,.14),transparent 70%),
    linear-gradient(var(--night),var(--night-2) 60%,var(--night));
  text-align:center;
  overflow:hidden;
}
.stars{position:absolute;inset:0;pointer-events:none;}
.stars i{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#fff;opacity:.5;animation:twinkle 3.4s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.75;transform:scale(1.15)}}
.blessing-card{
  position:relative;z-index:1;
  max-width:560px;margin:0 auto;
  border:1px solid rgba(245,214,123,.22);
  border-radius:26px;
  padding:38px 26px 34px;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
  backdrop-filter:blur(8px);
  box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);
}
.blessing-card h2{
  font-size:clamp(24px,6.6vw,32px);
  color:var(--gold);letter-spacing:.3em;text-indent:.3em;font-weight:700;
}
.poem{
  margin-top:22px;
  font-size:clamp(16px,4.6vw,20px);
  line-height:2.15;
  color:#f6ecd3;
  letter-spacing:.12em;
}
.poem .qi{color:#e9d9ae;}
.poem-source{margin-top:14px;font-size:12px;color:rgba(246,236,211,.5);letter-spacing:.24em;}
.blessing-line{
  margin:26px auto 0;max-width:34ch;
  font-size:14px;line-height:2;color:rgba(246,236,211,.82);
}
.divider{
  width:72px;height:1px;margin:0 auto 24px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

/* ---------- 放天灯 ---------- */
.sky{
  position:relative;
  background:linear-gradient(var(--night),#080c1f);
  padding:9vh 24px calc(env(safe-area-inset-bottom,0px) + 7vh);
  text-align:center;
  overflow:hidden;
}
.sky h2{
  font-size:clamp(24px,6.6vw,32px);
  color:var(--gold);letter-spacing:.24em;text-indent:.24em;
}
.sky p.tip{margin-top:12px;font-size:13px;color:rgba(246,236,211,.6);letter-spacing:.14em;}
.launch-btn{
  margin-top:26px;
  display:inline-flex;align-items:center;gap:10px;
  border:none;cursor:pointer;
  font-family:inherit;font-size:17px;font-weight:600;letter-spacing:.18em;text-indent:.18em;
  color:#3a2408;
  padding:16px 38px;
  border-radius:999px;
  background:linear-gradient(160deg,#ffe6a3,var(--gold-deep));
  box-shadow:0 10px 30px rgba(232,182,76,.35),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s;
}
.launch-btn:active{transform:scale(.94);box-shadow:0 4px 14px rgba(232,182,76,.3);}
.launch-btn svg{flex:none;}
.lantern-count{margin-top:16px;font-size:12px;color:rgba(246,236,211,.55);letter-spacing:.2em;}
.sky-field{
  position:relative;
  height:52vh;min-height:340px;
  margin-top:4vh;
  border-radius:24px;
  border:1px solid rgba(245,214,123,.12);
  background:
    radial-gradient(ellipse 70% 46% at 50% 108%,rgba(245,214,123,.1),transparent 70%),
    linear-gradient(#0d1330,#070a1a);
  overflow:hidden;
}
.sky-lantern{
  position:absolute;bottom:-90px;
  display:flex;flex-direction:column;align-items:center;
  animation:floatUp var(--dur,9s) linear forwards;
  will-change:transform,opacity;
  pointer-events:none;
}
.sky-lantern .sway{animation:sway 2.6s ease-in-out infinite;display:flex;flex-direction:column;align-items:center;}
@keyframes floatUp{
  0%{transform:translateY(0);opacity:0}
  6%{opacity:1}
  82%{opacity:1}
  100%{transform:translateY(calc(-52vh - 260px));opacity:0}
}
@keyframes sway{0%,100%{transform:translateX(-9px) rotate(-2deg)}50%{transform:translateX(9px) rotate(2deg)}}
.lantern-glow{filter:drop-shadow(0 0 14px rgba(255,158,80,.75));}
.wish-tag{
  margin-top:8px;
  font-size:12px;letter-spacing:.14em;
  color:#ffe9b0;white-space:nowrap;
  background:rgba(20,26,56,.72);
  border:1px solid rgba(245,214,123,.35);
  border-radius:999px;
  padding:5px 13px;
}

/* ---------- 页脚 ---------- */
.footer{
  background:#070a1a;
  padding:5vh 24px calc(env(safe-area-inset-bottom,0px) + 4vh);
  text-align:center;
}
.footer .seal{
  font-size:clamp(18px,5vw,22px);color:var(--gold);letter-spacing:.3em;text-indent:.3em;
}
.footer .year{margin-top:12px;font-size:12px;color:rgba(246,236,211,.45);letter-spacing:.22em;}
.footer .share{margin-top:16px;font-size:12px;color:rgba(246,236,211,.6);letter-spacing:.12em;}

@media (prefers-reduced-motion:reduce){
  .hero-bg{animation:none;}
  .scroll-hint svg{animation:none;}
  .stars i{animation:none;}
}
@media (min-width:720px){
  .hero-bg{background-position:center 25%;}
}
</style>
</head>
<body>

<!-- 首屏：团圆画卷 -->
<header class="hero" id="top">
  <div class="hero-bg" role="img" aria-label="中秋之夜，一家三代在庭院圆桌旁团圆聚餐，天上挂着一轮金色满月"></div>
  <div class="hero-veil-top"></div>
  <div class="hero-veil-bottom"></div>
  <canvas id="petals" aria-hidden="true"></canvas>
  <div class="hero-inner">
    <span class="hero-tag kai">乙巳中秋</span>
    <h1 class="hero-title kai" aria-label="中秋快乐"><span>中</span><span>秋</span><span>快</span><span>乐</span></h1>
    <p class="hero-sub kai">月满中秋 · 阖家团圆</p>
    <p class="hero-date">农历八月十五 · 千里共婵娟</p>
  </div>
  <div class="scroll-hint" aria-hidden="true">
    <span>下滑赏月</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#fbeecb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</header>

<!-- 团圆寄语 -->
<section class="blessing" id="blessing">
  <div class="stars" id="starsBox" aria-hidden="true"></div>
  <div class="blessing-card">
    <h2 class="kai">团圆寄语</h2>
    <div class="divider" style="margin-top:20px;"></div>
    <p class="poem kai">
      明月几时有，把酒问青天。<br>
      <span class="qi">但愿人长久，千里共婵娟。</span>
    </p>
    <p class="poem-source">—— 苏轼《水调歌头》</p>
    <div class="divider"></div>
    <p class="blessing-line">无论此刻你身在何处，抬头望见的，都是同一轮月亮。愿月光所至，皆是团圆；愿心之所念，皆能如愿。</p>
  </div>
</section>

<!-- 放天灯 -->
<section class="sky" id="sky">
  <h2 class="kai">放一盏天灯</h2>
  <p class="tip">点亮天灯，把心愿说给月亮听</p>
  <button class="launch-btn" id="launchBtn" type="button">
    <svg width="20" height="24" viewBox="0 0 20 26" fill="none" aria-hidden="true">
      <path d="M10 1C5.5 1 2 5 2 10c0 4 2.6 7.4 6.2 8.7L8 23h4l-.2-4.3C15.4 17.4 18 14 18 10c0-5-3.5-9-8-9Z" fill="#a34d12"/>
      <path d="M10 2.6C6.6 2.6 4 5.9 4 10c0 3 1.7 5.6 4.2 6.9L8.4 21h3.2l.2-4.1c2.5-1.3 4.2-3.9 4.2-6.9 0-4.1-2.6-7.4-6-7.4Z" fill="#ffb257"/>
      <ellipse cx="10" cy="12.5" rx="2.4" ry="3.4" fill="#ffe6a3"/>
    </svg>
    点亮天灯
  </button>
  <p class="lantern-count" id="lanternCount" aria-live="polite">已放飞 0 盏天灯</p>
  <div class="sky-field" id="skyField" aria-hidden="true"></div>
</section>

<footer class="footer" id="footer">
  <p class="seal kai">花好月圆人团圆</p>
  <p class="year">MID-AUTUMN FESTIVAL · 中秋佳节</p>
  <p class="share">长按右上角，把这份团圆分享给家人吧</p>
</footer>

<script>
(function(){
  "use strict";
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- 桂花花瓣 ---------- */
  var canvas = document.getElementById("petals");
  if (canvas && !reduceMotion) {
    var ctx = canvas.getContext("2d");
    var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    var petals = [];
    var COLORS = ["#f6c95b", "#f0b64a", "#ffe1a0", "#eab543"];

    function resize(){
      var r = canvas.parentElement.getBoundingClientRect();
      W = r.width; H = r.height;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function makePetal(seedTop){
      return {
        x: Math.random() * W,
        y: seedTop ? Math.random() * H : -20,
        r: 2.4 + Math.random() * 3.6,
        vy: 0.5 + Math.random() * 1.1,
        vx: 0,
        phase: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.04,
        rot: Math.random() * Math.PI,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        alpha: 0.5 + Math.random() * 0.5
      };
    }
    function tick(){
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < petals.length; i++){
        var p = petals[i];
        p.phase += 0.02;
        p.rot += p.spin;
        p.vx = Math.sin(p.phase) * 0.6;
        p.x += p.vx; p.y += p.vy;
        if (p.y > H + 24 || p.x < -30 || p.x > W + 30){ petals[i] = makePetal(false); continue; }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(tick);
    }
    resize();
    var count = Math.max(18, Math.min(70, Math.floor(W / 9)));
    for (var i = 0; i < count; i++) petals.push(makePetal(true));
    window.addEventListener("resize", resize);
    requestAnimationFrame(tick);
  }

  /* ---------- 星空 ---------- */
  var starsBox = document.getElementById("starsBox");
  if (starsBox) {
    var n = window.innerWidth < 720 ? 26 : 44;
    for (var i = 0; i < n; i++){
      var s = document.createElement("i");
      s.style.left = (Math.random() * 100).toFixed(2) + "%";
      s.style.top = (Math.random() * 100).toFixed(2) + "%";
      s.style.animationDelay = (Math.random() * 3.4).toFixed(2) + "s";
      var size = (1 + Math.random() * 1.6).toFixed(1);
      s.style.width = size + "px"; s.style.height = size + "px";
      starsBox.appendChild(s);
    }
  }

  /* ---------- 放天灯 ---------- */
  var WISHES = [
    "花好月圆，阖家幸福",
    "月圆人圆事事圆满",
    "但愿人长久，千里共婵娟",
    "月光所至，皆是团圆",
    "岁岁常欢愉，年年皆胜意",
    "阖家安康，万事顺遂",
    "中秋喜乐，平安顺意",
    "心有光华，人生无缺",
    "团圆美满，幸福绵长",
    "所愿皆所得，所行皆坦途"
  ];
  var field = document.getElementById("skyField");
  var btn = document.getElementById("launchBtn");
  var counterEl = document.getElementById("lanternCount");
  var launched = 0;
  var wishIdx = (Math.random() * WISHES.length) | 0;

  var LANTERN_SVG = '<svg class="lantern-glow" width="46" height="58" viewBox="0 0 46 58" fill="none">'
    + '<path d="M23 2C12 2 4 11 4 22c0 9 5.6 16.4 13.4 19.4L16.6 52h12.8l-.8-10.6C36.4 38.4 42 31 42 22 42 11 34 2 23 2Z" fill="#c2571a"/>'
    + '<path d="M23 5C14.5 5 8 12.6 8 22c0 6.8 3.9 12.8 9.6 15.7l.9 9.3h9l.9-9.3C34.1 34.8 38 28.8 38 22 38 12.6 31.5 5 23 5Z" fill="#ff9e50"/>'
    + '<ellipse cx="23" cy="27" rx="5.4" ry="7.6" fill="#ffe6a3"/>'
    + '<ellipse cx="23" cy="29" rx="2.6" ry="4" fill="#fff3cf"/>'
    + '</svg>';

  function launch(){
    if (!field) return;
    var active = field.querySelectorAll(".sky-lantern").length;
    if (active >= 8) return;

    launched++;
    counterEl.textContent = "已放飞 " + launched + " 盏天灯";

    var wrap = document.createElement("div");
    wrap.className = "sky-lantern";
    var fieldW = field.clientWidth;
    var x = 10 + Math.random() * Math.max(fieldW - 90, 40);
    wrap.style.left = x + "px";
    var dur = 8 + Math.random() * 4;
    wrap.style.setProperty("--dur", dur.toFixed(1) + "s");

    var sway = document.createElement("div");
    sway.className = "sway";
    sway.style.animationDelay = (-Math.random() * 2.6).toFixed(2) + "s";

    var lamp = document.createElement("div");
    lamp.innerHTML = LANTERN_SVG;
    var scale = 0.7 + Math.random() * 0.5;
    lamp.style.transform = "scale(" + scale.toFixed(2) + ")";

    var tag = document.createElement("span");
    tag.className = "wish-tag kai";
    tag.textContent = WISHES[wishIdx % WISHES.length];
    wishIdx++;

    sway.appendChild(lamp);
    sway.appendChild(tag);
    wrap.appendChild(sway);
    field.appendChild(wrap);

    if (reduceMotion) {
      setTimeout(function(){ if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 2600);
      wrap.style.animation = "none";
      wrap.style.bottom = "60%";
      wrap.style.opacity = "1";
    } else {
      wrap.addEventListener("animationend", function(){
        if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      });
    }
  }

  if (btn) btn.addEventListener("click", launch);
})();
</script>
</body>
</html>
